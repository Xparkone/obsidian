          3. 涉及 Ansible/playbook/role → 自动化类别
          4. 涉及 GitLab CI、.gitlab-ci.yml、Runner → CI/CD 类别
          5. 用户明确说「整理笔记」「写成文档」「入库」→ 知识沉淀
          6. 无法判断时选「其它计算机问题」
