        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |
      你好，我是你的运维 / 计算机个人知识库助手。

      我会先对问题分类，再检索你的知识库（Ansible、UFW、DNS、tcpdump、GitLab、Docker/K8s 等），优先给出可执行的结论与命令。

      你可以：
      - 直接问排障 / 配置问题
      - 说「整理成笔记」把经验沉淀为 Markdown
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - UFW 怎么只允许指定 IP 访问 SSH？
    - 用 tcpdump 抓 HTTP 包并过滤主机名怎么写？
    - Ansible 部署 Nginx 站点的推荐 role 结构？
    - GitLab Docker Compose 升级要注意什么？
    - 帮我把这段排障过程整理成可入库笔记
    suggested_questions_after_answer:
      enabled: true
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
